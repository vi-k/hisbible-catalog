name: build

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:
    inputs:
      limit:
        description: At most this many new and updated modules; empty is all
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: catalog-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.0
      - run: dart pub get
      - name: Build the catalog
        env:
          GH_TOKEN: ${{ github.token }}
          LIMIT: ${{ inputs.limit }}
        run: dart run catalog_builder:build --limit "$LIMIT"
      - name: Keep the report and the deletion list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-build
          path: |
            out/report.md
            out/deletions.json
      - name: Report
        run: cat out/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index sources
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: каталог $(date -u +%Y-%m-%d)"
          git push origin HEAD:main
      - name: Delete files the index no longer uses
        env:
          GH_TOKEN: ${{ github.token }}
        run: dart run catalog_builder:build --apply-deletions out/deletions.json
