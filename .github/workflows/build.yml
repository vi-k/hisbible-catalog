name: build

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:
    inputs:
      limit:
        description: At most this many new and updated modules; empty is all
        required: false
        default: ''
      allow_mass_withdrawal:
        description: Withdraw modules even beyond the mass withdrawal limit
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: catalog-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Через 300 минут (--deadline) сборка не берёт новых переводов, и до
    # конца задания остаётся время закоммитить собранное.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.0
      - run: dart pub get
      # Прогон сперва удаляет файлы, которые прошлый прогон записал
      # в sources/pending-deletions.json, потом собирает и записывает туда
      # файлы, на которые его указатель больше не ссылается.
      - name: Build the catalog
        env:
          GH_TOKEN: ${{ github.token }}
          LIMIT: ${{ inputs.limit }}
          ALLOW_MASS_WITHDRAWAL: ${{ inputs.allow_mass_withdrawal }}
        run: |
          args=(--limit "$LIMIT" --deadline 300)
          if [ "$ALLOW_MASS_WITHDRAWAL" = true ]; then
            args+=(--allow-mass-withdrawal)
          fi
          dart run catalog_builder:build "${args[@]}"
      - name: Keep the report and the deletion list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-build
          path: |
            out/report.md
            sources/pending-deletions.json
      - name: Report
        run: cat out/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index sources
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: каталог $(date -u +%Y-%m-%d)"
          # Пока шла сборка, в main могли запушить. Бот трогает только index/
          # и sources/, так что rebase чистый, если их не правили руками,
          # а тогда отказ и нужен.
          git pull --rebase origin main
          git push origin HEAD:main
