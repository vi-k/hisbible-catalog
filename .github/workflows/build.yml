name: build

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:
    inputs:
      limit:
        description: At most this many new and updated modules; empty is all
        required: false
        default: ''
      rebuild:
        description: >-
          Translation ids to rebuild as a new revision, separated by spaces or
          commas
        required: false
        default: ''
      rebuild_all:
        description: Rebuild every module as a new revision
        required: false
        type: boolean
        default: false
      allow_mass_withdrawal:
        description: Withdraw modules even beyond the mass withdrawal limit
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: catalog-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Через 300 минут (--deadline) сборка не берёт новых переводов, и до
    # конца задания остаётся время закоммитить собранное.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.0
      - run: dart pub get
      # Прогон сперва удаляет файлы, которые прошлый прогон записал
      # в sources/pending-deletions.json, потом собирает и записывает туда
      # файлы, на которые его указатель больше не ссылается.
      #
      # Код 3: указатель, список исходников и отчёт записаны, но прогон
      # должен покраснеть: сборка отказалась от массового отзыва (все
      # модули остались) или не собрала id из rebuild. Такой прогон
      # коммитится как обычно, а падает последний шаг, «Fail the run».
      - name: Build the catalog
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          LIMIT: ${{ inputs.limit }}
          REBUILD: ${{ inputs.rebuild }}
          REBUILD_ALL: ${{ inputs.rebuild_all }}
          ALLOW_MASS_WITHDRAWAL: ${{ inputs.allow_mass_withdrawal }}
        run: |
          args=(--limit "$LIMIT" --deadline 300)
          read -ra ids <<< "${REBUILD//,/ }"
          for id in "${ids[@]}"; do
            args+=(--rebuild "$id")
          done
          if [ "$REBUILD_ALL" = true ]; then
            args+=(--rebuild-all)
          fi
          if [ "$ALLOW_MASS_WITHDRAWAL" = true ]; then
            args+=(--allow-mass-withdrawal)
          fi
          status=0
          dart run catalog_builder:build "${args[@]}" || status=$?
          if [ "$status" -eq 3 ]; then
            echo 'red=true' >> "$GITHUB_OUTPUT"
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi
      - name: Keep the report and the deletion list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-build
          path: |
            out/report.md
            sources/pending-deletions.json
      - name: Report
        run: cat out/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index sources
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: каталог $(date -u +%Y-%m-%d)"
          # Пока шла сборка, в main могли запушить. Бот трогает только index/
          # и sources/, так что rebase чистый, если их не правили руками,
          # а тогда отказ и нужен.
          git pull --rebase origin main
          git push origin HEAD:main
      # Причины — жирные строки отчёта. Шаг идёт и тогда, когда коммит
      # или пуш не удался.
      - name: Fail the run
        if: always() && steps.build.outputs.red == 'true'
        run: |
          grep -o -e 'Withdrawal refused: [^*]*' -e 'Rebuild not done: [^*]*' \
            out/report.md > reasons.txt || true
          if [ ! -s reasons.txt ]; then
            echo 'The build asked to fail the run; see the report.' > reasons.txt
          fi
          while IFS= read -r reason; do
            echo "::error title=Catalog build needs attention::$reason"
          done < reasons.txt
          echo 'Index and lock are committed unless the commit step failed.'
          echo 'The report is in the summary and the artifact.'
          echo 'Workflow inputs: allow_mass_withdrawal, rebuild, rebuild_all.'
          exit 1
